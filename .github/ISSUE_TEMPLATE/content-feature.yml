---
name: 内容或功能建议
description: 提出网站内容、可访问性或功能改进
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: 建议内容
      description: 请描述建议及其希望解决的问题。
      placeholder: 我希望……
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据或素材来源
      description: 请注明已核实的事实、授权素材或参考资料。
    validations:
      required: false
